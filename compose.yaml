services:

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev

    volumes:
      - .:/app
      - gocache:/root/.cache/go-build
      - gomod:/go/pkg/mod

    ports:
      - "9050:8080"

    env_file:
      - .env

    environment:
      - PORT=${PORT}
      - ENV=${ENV}
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - wassimo-network


  prod:
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "9060:8080"

    env_file:
      - .env

    environment:
      - PORT=8080
      - ENV=dev
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - wassimo-network


  postgres:
    image: postgres:18

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - catalog-pgdata:/var/lib/postgresql

    ports:
      - "5441:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

    networks:
      - wassimo-network


volumes:
  catalog-pgdata:
  gocache:
  gomod:


networks:
  wassimo-network:
    external: true
